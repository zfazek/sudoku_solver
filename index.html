<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sudoku Solver</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
        h1 {
            text-align: center;
        }

        table#table {
            margin: 0 auto;
            border-collapse: collapse;
        }

        table#table td[colspan] {
            text-align: center;
        }

        #tooltip {
            display: none;
            position: absolute;
            z-index: 10;
            background: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        #status {
            display: none;
            text-align: center;
            margin: 8px auto;
            padding: 8px 12px;
            max-width: 300px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            font-family: sans-serif;
            font-weight: bold;
        }

        td.top_left {
            border-style: solid;
            border-width: medium 0px 0px medium;
        }
        td.top_right {
            border-style: solid;
            border-width: medium medium 0px 0px;
        }
        td.bottom_left {
            border-style: solid;
            border-width: 0px 0px medium medium;
        }
        td.bottom_right {
            border-style: solid;
            border-width: 0px medium medium 0px;
        }
        td.top {
            border-style: solid;
            border-width: medium 0px 0px 0px;
        }
        td.right {
            border-style: solid;
            border-width: 0px medium 0px 0px;
        }
        td.bottom {
            border-style: solid;
            border-width: 0px 0px medium 0px;
        }
        td.left {
            border-style: solid;
            border-width: 0px 0px 0px medium;
        }
    </style>
        <script>
var solved;
var init_table = [
    1, 5, 0,  0, 4, 2,  0, 0, 6,
    2, 7, 4,  5, 6, 0,  0, 1, 0,
    0, 0, 6,  0, 0, 7,  4, 0, 2,
    0, 1, 0,  0, 0, 0,  0, 4, 0,
    0, 0, 0,  0, 5, 0,  0, 0, 0,
    0, 6, 0,  4, 0, 3,  1, 9, 0,
    0, 2, 0,  6, 0, 5,  9, 0, 0,
    9, 8, 5,  0, 3, 0,  0, 6, 0,
    0, 4, 0,  2, 1, 9,  8, 3, 0
];
var table = [];
// Undo support: history is a stack of { id, prev } moves; cellValues tracks the
// last-known value of each cell so input handlers can determine what changed.
var moveHistory = [];
var cellValues = {};

// Snapshot the current grid values into cellValues and clear the undo history.
// Called after bulk operations (load / reset / solve) which are not undoable.
function resetHistory() {
    moveHistory = [];
    cellValues = {};
    for (let r = 1; r <= 9; r++) {
        for (let c = 1; c <= 9; c++) {
            let id = r + "" + c;
            let el = document.getElementById(id);
            cellValues[id] = el ? el.value : "";
        }
    }
    updateUndoButton();
}

// Record a single cell change for undo.
function recordMove(id, prevValue) {
    moveHistory.push({ id: id, prev: prevValue });
    updateUndoButton();
}

function updateUndoButton() {
    let btn = document.getElementById("undo");
    if (btn) {
        btn.disabled = moveHistory.length === 0;
    }
}

// Revert the most recent recorded move.
function undo() {
    if (moveHistory.length === 0) {
        return;
    }
    let move = moveHistory.pop();
    let input = document.getElementById(move.id);
    input.value = move.prev;
    cellValues[move.id] = move.prev;
    hideCandidates();
    updateHints();
    markConflict(input);
    checkSolved();
    updateUndoButton();
}

function reset() {
    solved = false;
    table = [];
    for (let i = 0; i < init_table.length; i++) {
        table[i] = 0;
    }
}

function init_1() {
    solved = false;
    table = [];
    for (let i = 0; i < init_table.length; i++) {
        table[i] = init_table[i];
    }
}

function getValuesFromGui() {
    for (let i = 0; i < 81; i++) {
        let x = Math.floor(i / 9) + 1;
        let y = i % 9 + 1;
        let id = x + "" + y;
        let value = parseInt(document.getElementById(id).value);
        if (!isNaN(value) && value >= 1 && value <= 9) {
            table[i] = value;
        } else {
            table[i] = 0;
        }
    }
}

function render() {
    for (let i = 0; i < 81; i++) {
        let x = Math.floor(i / 9) + 1;
        let y = i % 9 + 1;
        let id = x + "" + y;
        if (table[i] > 0 && table[i] < 10) {
            document.getElementById(id).value = table[i];
        } else {
            document.getElementById(id).value = "";
        }
    }
    updateHints();
    checkSolved();
}

function cellClass(r, c) {
    let v = (r === 0) ? "top" : (r % 3 === 2) ? "bottom" : "";
    let h = (c === 0) ? "left" : (c % 3 === 2) ? "right" : "";
    if (v && h) {
        return v + "_" + h;
    }
    return v || h || "";
}

function sanitizeCell(input) {
    // Keep only a single digit 1-9; strip anything else (0, letters, symbols).
    let v = input.value.replace(/[^1-9]/g, "");
    input.value = v.length > 0 ? v[0] : "";
}

// Handles a manual cell edit: sanitize, record the change for undo, then refresh
// hints / conflict marking / solved status.
function handleInput(input) {
    sanitizeCell(input);
    let id = input.id;
    let prev = (id in cellValues) ? cellValues[id] : "";
    if (input.value !== prev) {
        recordMove(id, prev);
        cellValues[id] = input.value;
    }
    updateHints();
    markConflict(input);
    checkSolved();
}

// Returns the list of values 1-9 that can legally be placed at board index i,
// given the current contents of `table` (row, column and 3x3 box constraints).
function candidates(i) {
    let x = i % 9;
    let y = Math.floor(i / 9);
    let used = {};
    for (let k = 0; k < 9; k++) {
        used[table[9 * y + k]] = true;   // row
        used[table[9 * k + x]] = true;   // column
    }
    let boxRow = 3 * Math.floor(y / 3);
    let boxCol = 3 * Math.floor(x / 3);
    for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
            used[table[9 * (boxRow + r) + boxCol + c]] = true;
        }
    }
    let result = [];
    for (let n = 1; n <= 9; n++) {
        if (!used[n]) {
            result.push(n);
        }
    }
    return result;
}

// Hover handlers: show legal candidate values for an empty cell in a custom,
// instant popup positioned next to the hovered cell.
function showCandidates(input) {
    let x = parseInt(input.id[0]) - 1;   // row  (id is "<row+1><col+1>")
    let y = parseInt(input.id[1]) - 1;   // column
    let i = x * 9 + y;
    getValuesFromGui();                  // reflect whatever the user has typed

    let tip = document.getElementById("tooltip");
    if (table[i] !== 0) {
        tip.style.display = "none";      // filled cell: nothing to suggest
        return;
    }

    let options = candidates(i);
    tip.textContent = options.length > 0
        ? "Possible: " + options.join(" ")
        : "No possible value";

    // Position just to the right of the cell, accounting for page scroll.
    let rect = input.getBoundingClientRect();
    let scrollX = window.pageXOffset || document.documentElement.scrollLeft;
    let scrollY = window.pageYOffset || document.documentElement.scrollTop;
    tip.style.left = (rect.right + scrollX + 6) + "px";
    tip.style.top = (rect.top + scrollY) + "px";
    tip.style.display = "block";
}

function hideCandidates() {
    document.getElementById("tooltip").style.display = "none";
}

// When the Hint checkbox is on, highlight empty cells that have exactly one
// legal candidate value with a light-yellow background. Otherwise clear all
// highlights.
function updateHints() {
    let on = document.getElementById("hint").checked;
    getValuesFromGui();
    for (let i = 0; i < 81; i++) {
        let x = Math.floor(i / 9) + 1;
        let y = i % 9 + 1;
        let cell = document.getElementById(x + "" + y);
        if (on && table[i] === 0 && candidates(i).length === 1) {
            cell.style.backgroundColor = "lightyellow";
        } else {
            cell.style.backgroundColor = "";
        }
    }
}

// Marks the given cell's background red if its value conflicts with another
// cell in the same row, column, or 3x3 box. Clears the red otherwise.
// Call this AFTER updateHints() so the conflict marking takes precedence.
function markConflict(input) {
    let x = parseInt(input.id[0]) - 1;   // row  (id is "<row+1><col+1>")
    let y = parseInt(input.id[1]) - 1;   // column
    let i = x * 9 + y;
    getValuesFromGui();
    if (table[i] !== 0 && !isCorrect(i)) {
        input.style.backgroundColor = "lightcoral";
    } else {
        input.style.backgroundColor = "";
    }
}

// When Hint is on, clicking an empty cell that has exactly one legal candidate
// fills it in with that value automatically.
function fillIfSingle(input) {
    if (!document.getElementById("hint").checked) {
        return;
    }
    let x = parseInt(input.id[0]) - 1;   // row  (id is "<row+1><col+1>")
    let y = parseInt(input.id[1]) - 1;   // column
    let i = x * 9 + y;
    getValuesFromGui();
    if (table[i] !== 0) {
        return;                          // already filled
    }
    let options = candidates(i);
    if (options.length === 1) {
        let prev = (input.id in cellValues) ? cellValues[input.id] : "";
        input.value = options[0];
        recordMove(input.id, prev);
        cellValues[input.id] = input.value;
        hideCandidates();                // dismiss any open tooltip
        updateHints();                   // refresh highlights (may reveal new singles)
        checkSolved();                   // announce if the board is now complete
    }
}

// True when all 81 cells are filled (1-9) and the board has no conflicts.
function isComplete() {
    for (let i = 0; i < 81; i++) {
        if (table[i] < 1 || table[i] > 9) {
            return false;
        }
    }
    for (let i = 0; i < 81; i++) {
        if (!isCorrect(i)) {
            return false;
        }
    }
    return true;
}

// Shows a success banner when the puzzle is fully and correctly solved,
// otherwise hides it. Reads the current GUI values first.
function checkSolved() {
    getValuesFromGui();
    let status = document.getElementById("status");
    if (isComplete()) {
        status.textContent = "\u{1F389} Solved! Well done!";
        status.style.display = "block";
    } else {
        status.style.display = "none";
    }
}

function buildGrid() {
    let grid = document.getElementById("grid");
    let html = "";
    for (let r = 0; r < 9; r++) {
        html += "<tr>";
        for (let c = 0; c < 9; c++) {
            let id = (r + 1) + "" + (c + 1);
            let cls = cellClass(r, c);
            let classAttr = cls ? ' class="' + cls + '"' : "";
            html += "<td" + classAttr + '><input type="text" inputmode="numeric" pattern="[1-9]" maxlength="1" size="1" oninput="handleInput(this)" onclick="fillIfSingle(this)" onmouseenter="showCandidates(this)" onmouseleave="hideCandidates()" id="' + id + '"></td>';
        }
        html += "</tr>";
    }
    grid.innerHTML = html;
}

function main() {
    buildGrid();
    init_1();
    render();
    resetHistory();
}

function reset_button() {
    reset();
    render();
    resetHistory();
}

function checkInitialPosition() {
    for (let i = 0; i < 81; i++) {
        if (table[i] > 0) {
            let correct = isCorrect(i);
            if (!correct) {
                return false;
            }
        }
    }
    return true;
}

function solve() {
    solved = false;
    console.log("solving...");
    getValuesFromGui();
    let isValid = checkInitialPosition();
    if (isValid) {
        solveFrom(0);
        render();
        if (solved) {
            console.log("solved");
            resetHistory();
        } else {
            alert("Invalid position, unable to solve!");
        }
    } else {
        alert("Invalid position, unable to solve!");
    }
}

function isCorrect(idx) {
    let x = idx % 9;
    let y = Math.floor(idx / 9);
    for (let i = 0; i < 9; i++) {
        let idx1 = 9 * y + i;
        if (idx != idx1 && table[idx] == table[idx1]) {
            return false;
        }
        let idx2 = 9 * i + x;
        if (idx != idx2 && table[idx] == table[idx2]) {
            return false;
        }
    }
    let boxRow = 3 * Math.floor(y / 3);
    let boxCol = 3 * Math.floor(x / 3);
    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            let idx1 = 9 * (boxRow + i) + boxCol + j;
            if (idx != idx1 && table[idx] == table[idx1]) {
                return false;
            }
        }
    }
    return true;
}

function solveFrom(i) {
    if (i >= 81) {
        solved = true;
        return;
    }
    if (table[i] != 0) {
        solveFrom(i + 1);
        return;
    }
    for (let n = 1; n <= 9; n++) {
        table[i] = n;
        if (isCorrect(i)) {
            solveFrom(i + 1);
            if (solved) {
                return;
            }
        }
    }
    table[i] = 0;
}
        </script>
    </head>
    <body onload="main()">
        <div id="tooltip"></div>
        <div>
            <h1>Sudoku Solver</h1>
            <div id="status"></div>
            <form action="javascript:solve();" method="get">
                <div id="main">
                    <table id="table">
                        <tbody id="grid"></tbody>
                        <tr>
                            <td colspan="9">
                                <label><input id="hint" type="checkbox" onchange="updateHints();"> Hint</label>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="9"><input type="submit" value="Solve"></td>
                        </tr>
                        <tr>
                            <td colspan="9"><input id="init_1" type="button" value="Init 1" onclick="window.main();"></td>
                        </tr>
                        <tr>
                            <td colspan="9"><input id="reset" type="button" value="Reset" onclick="reset_button();"></td>
                        </tr>
                        <tr>
                            <td colspan="9"><input id="undo" type="button" value="Undo" onclick="window.undo();" disabled></td>
                        </tr>
                    </table>
                </div>
            </form>
        </div>
    </body>
</html>
