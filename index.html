<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sudoku Solver</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
        h1 {
            text-align: center;
        }

        table#table {
            margin: 0 auto;
            border-collapse: collapse;
        }

        table#table td[colspan] {
            text-align: center;
        }

        td.top_left {
            border-style: solid;
            border-width: medium 0px 0px medium;
        }
        td.top_right {
            border-style: solid;
            border-width: medium medium 0px 0px;
        }
        td.bottom_left {
            border-style: solid;
            border-width: 0px 0px medium medium;
        }
        td.bottom_right {
            border-style: solid;
            border-width: 0px medium medium 0px;
        }
        td.top {
            border-style: solid;
            border-width: medium 0px 0px 0px;
        }
        td.right {
            border-style: solid;
            border-width: 0px medium 0px 0px;
        }
        td.bottom {
            border-style: solid;
            border-width: 0px 0px medium 0px;
        }
        td.left {
            border-style: solid;
            border-width: 0px 0px 0px medium;
        }
    </style>
        <script>
var solved;
var init_table = [
    1, 5, 0,  0, 4, 2,  0, 0, 6,
    2, 7, 4,  5, 6, 0,  0, 1, 0,
    0, 0, 6,  0, 0, 7,  4, 0, 2,
    0, 1, 0,  0, 0, 0,  0, 4, 0,
    0, 0, 0,  0, 5, 0,  0, 0, 0,
    0, 6, 0,  4, 0, 3,  1, 9, 0,
    0, 2, 0,  6, 0, 5,  9, 0, 0,
    9, 8, 5,  0, 3, 0,  0, 6, 0,
    0, 4, 0,  2, 1, 9,  8, 3, 0
];
var table = [];

function reset() {
    solved = false;
    table = [];
    for (let i = 0; i < init_table.length; i++) {
        table[i] = 0;
    }
}

function init_1() {
    solved = false;
    table = [];
    for (let i = 0; i < init_table.length; i++) {
        table[i] = init_table[i];
    }
}

function getValuesFromGui() {
    for (let i = 0; i < 81; i++) {
        let x = Math.floor(i / 9) + 1;
        let y = i % 9 + 1;
        let id = x + "" + y;
        let value = parseInt(document.getElementById(id).value);
        if (!isNaN(value) && value >= 1 && value <= 9) {
            table[i] = value;
        } else {
            table[i] = 0;
        }
    }
}

function render() {
    for (let i = 0; i < 81; i++) {
        let x = Math.floor(i / 9) + 1;
        let y = i % 9 + 1;
        let id = x + "" + y;
        if (table[i] > 0 && table[i] < 10) {
            document.getElementById(id).value = table[i];
        } else {
            document.getElementById(id).value = "";
        }
    }
}

function cellClass(r, c) {
    let v = (r === 0) ? "top" : (r % 3 === 2) ? "bottom" : "";
    let h = (c === 0) ? "left" : (c % 3 === 2) ? "right" : "";
    if (v && h) {
        return v + "_" + h;
    }
    return v || h || "";
}

function sanitizeCell(input) {
    // Keep only a single digit 1-9; strip anything else (0, letters, symbols).
    let v = input.value.replace(/[^1-9]/g, "");
    input.value = v.length > 0 ? v[0] : "";
}

function buildGrid() {
    let grid = document.getElementById("grid");
    let html = "";
    for (let r = 0; r < 9; r++) {
        html += "<tr>";
        for (let c = 0; c < 9; c++) {
            let id = (r + 1) + "" + (c + 1);
            let cls = cellClass(r, c);
            let classAttr = cls ? ' class="' + cls + '"' : "";
            html += "<td" + classAttr + '><input type="text" inputmode="numeric" pattern="[1-9]" maxlength="1" size="1" oninput="sanitizeCell(this)" id="' + id + '"></td>';
        }
        html += "</tr>";
    }
    grid.innerHTML = html;
}

function main() {
    buildGrid();
    init_1();
    render();
}

function reset_button() {
    reset();
    render();
}

function checkInitialPosition() {
    for (let i = 0; i < 81; i++) {
        if (table[i] > 0) {
            let correct = isCorrect(i);
            if (!correct) {
                return false;
            }
        }
    }
    return true;
}

function solve() {
    solved = false;
    console.log("solving...");
    getValuesFromGui();
    let isValid = checkInitialPosition();
    if (isValid) {
        solveFrom(0);
        render();
        if (solved) {
            console.log("solved");
        } else {
            alert("Invalid position, unable to solve!");
        }
    } else {
        alert("Invalid position, unable to solve!");
    }
}

function isCorrect(idx) {
    let x = idx % 9;
    let y = Math.floor(idx / 9);
    for (let i = 0; i < 9; i++) {
        let idx1 = 9 * y + i;
        if (idx != idx1 && table[idx] == table[idx1]) {
            return false;
        }
        let idx2 = 9 * i + x;
        if (idx != idx2 && table[idx] == table[idx2]) {
            return false;
        }
    }
    let boxRow = 3 * Math.floor(y / 3);
    let boxCol = 3 * Math.floor(x / 3);
    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            let idx1 = 9 * (boxRow + i) + boxCol + j;
            if (idx != idx1 && table[idx] == table[idx1]) {
                return false;
            }
        }
    }
    return true;
}

function solveFrom(i) {
    if (i >= 81) {
        solved = true;
        return;
    }
    if (table[i] != 0) {
        solveFrom(i + 1);
        return;
    }
    for (let n = 1; n <= 9; n++) {
        table[i] = n;
        if (isCorrect(i)) {
            solveFrom(i + 1);
            if (solved) {
                return;
            }
        }
    }
    table[i] = 0;
}
        </script>
    </head>
    <body onload="main()">
        <div>
            <h1>Sudoku Solver</h1>
            <form action="javascript:solve();" method="get">
                <div id="main">
                    <table id="table">
                        <tbody id="grid"></tbody>
                        <tr>
                            <td colspan="9"><input type="submit" value="Solve"></td>
                        </tr>
                        <tr>
                            <td colspan="9"><input id="init_1" type="button" value="Init 1" onclick="main();"></td>
                        </tr>
                        <tr>
                            <td colspan="9"><input id="reset" type="button" value="Reset" onclick="reset_button();"></td>
                        </tr>
                    </table>
                </div>
            </form>
        </div>
    </body>
</html>
